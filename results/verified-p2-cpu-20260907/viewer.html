<body><main><nav><a href="https://github.com/XavierYChen/e3-routing-smoke">Smoke</a><a href="https://github.com/XavierYChen/e3-routing-p0">P0</a><a href="https://github.com/XavierYChen/e3-routing-p1">P1</a><b>P2</b></nav>
<h1>E3 P2 · Token Routing Spatial Viewer</h1><p>面向 B1、D1、A3 与 WebUI 的只读路由证据。<span class="pill">MOT = token</span> <span class="pill">MOE/LATENT = image</span></p>
<div class="panel"><label>视图 <select id="pick"></select></label><p id="meta"></p><img id="plot" alt="routing overlay"></div>
<script>const data=[{"family": "MOE", "metric": "expert_0", "file": "artifacts/moe_expert_0.png", "scope": "image", "layer": "model.4.m.0.0.mlp.routing"}, {"family": "MOE", "metric": "expert_1", "file": "artifacts/moe_expert_1.png", "scope": "image", "layer": "model.4.m.0.0.mlp.routing"}, {"family": "MOE", "metric": "expert_2", "file": "artifacts/moe_expert_2.png", "scope": "image", "layer": "model.4.m.0.0.mlp.routing"}, {"family": "MOE", "metric": "expert_3", "file": "artifacts/moe_expert_3.png", "scope": "image", "layer": "model.4.m.0.0.mlp.routing"}, {"family": "MOE", "metric": "primary", "file": "artifacts/moe_primary.png", "scope": "image", "layer": "model.4.m.0.0.mlp.routing"}, {"family": "MOE", "metric": "relative_contrast", "file": "artifacts/moe_relative_contrast.png", "scope": "image", "layer": "model.4.m.0.0.mlp.routing"}, {"family": "MOE", "metric": "entropy", "file": "artifacts/moe_entropy.png", "scope": "image", "layer": "model.4.m.0.0.mlp.routing"}, {"family": "MOE", "metric": "dominant", "file": "artifacts/moe_dominant.png", "scope": "image", "layer": "model.4.m.0.0.mlp.routing"}, {"family": "MOT", "metric": "expert_0", "file": "artifacts/mot_expert_0.png", "scope": "token", "layer": "model.16.m.0.router"}, {"family": "MOT", "metric": "expert_1", "file": "artifacts/mot_expert_1.png", "scope": "token", "layer": "model.16.m.0.router"}, {"family": "MOT", "metric": "expert_2", "file": "artifacts/mot_expert_2.png", "scope": "token", "layer": "model.16.m.0.router"}, {"family": "MOT", "metric": "primary", "file": "artifacts/mot_primary.png", "scope": "token", "layer": "model.16.m.0.router"}, {"family": "MOT", "metric": "relative_contrast", "file": "artifacts/mot_relative_contrast.png", "scope": "token", "layer": "model.16.m.0.router"}, {"family": "MOT", "metric": "entropy", "file": "artifacts/mot_entropy.png", "scope": "token", "layer": "model.16.m.0.router"}, {"family": "MOT", "metric": "dominant", "file": "artifacts/mot_dominant.png", "scope": "token", "layer": "model.16.m.0.router"}, {"family": "LATENT", "metric": "expert_0", "file": "artifacts/latent_expert_0.png", "scope": "image", "layer": "model.23.router"}, {"family": "LATENT", "metric": "expert_1", "file": "artifacts/latent_expert_1.png", "scope": "image", "layer": "model.23.router"}, {"family": "LATENT", "metric": "expert_2", "file": "artifacts/latent_expert_2.png", "scope": "image", "layer": "model.23.router"}, {"family": "LATENT", "metric": "expert_3", "file": "artifacts/latent_expert_3.png", "scope": "image", "layer": "model.23.router"}, {"family": "LATENT", "metric": "primary", "file": "artifacts/latent_primary.png", "scope": "image", "layer": "model.23.router"}, {"family": "LATENT", "metric": "relative_contrast", "file": "artifacts/latent_relative_contrast.png", "scope": "image", "layer": "model.23.router"}, {"family": "LATENT", "metric": "entropy", "file": "artifacts/latent_entropy.png", "scope": "image", "layer": "model.23.router"}, {"family": "LATENT", "metric": "dominant", "file": "artifacts/latent_dominant.png", "scope": "image", "layer": "model.23.router"}];const pick=document.querySelector('#pick'),plot=document.querySelector('#plot'),meta=document.querySelector('#meta');data.forEach((x,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`${x.family} · ${x.metric}`;pick.appendChild(o)});function show(){const x=data[+pick.value];plot.src=x.file;meta.innerHTML=`<b>${x.family}</b> · <code>${x.layer}</code> · ${x.scope}-level`;}pick.onchange=show;show();</script></main></body></html>
